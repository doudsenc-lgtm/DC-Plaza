<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer votre première entreprise — DC PLAZA</title>
<style>
:root{--bg:#050505;--card:rgba(255,255,255,.055);--text:#f5f5f7;--muted:#a1a1aa;--line:rgba(255,255,255,.12);--accent:#746cff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 20%,rgba(116,108,255,.2),transparent 34%),#050505;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif}main{width:min(1040px,92%);margin:auto;padding:56px 0}.back{display:inline-block;color:var(--muted);text-decoration:none;margin-bottom:38px}.purchase{display:grid;grid-template-columns:minmax(220px,360px) minmax(0,1fr);gap:56px;align-items:center;padding:clamp(24px,5vw,56px);border:1px solid var(--line);border-radius:28px;background:var(--card);box-shadow:0 30px 90px rgba(0,0,0,.35);backdrop-filter:blur(20px)}.cover{aspect-ratio:3/4;border-radius:16px;padding:9%;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,#746cff,#30276f 62%,#17142d);box-shadow:18px 22px 38px rgba(0,0,0,.42),inset 0 0 0 1px rgba(255,255,255,.22)}.cover small{letter-spacing:.14em;text-transform:uppercase;color:#d9d7ff}.cover h1{font-size:clamp(1.8rem,4vw,3rem);line-height:1.03;margin:0}.cover span{font-size:.85rem;color:#e4e3ff}.eyebrow{color:#b9b5ff;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.details h2{font-size:clamp(2rem,4vw,3.3rem);line-height:1.05;margin:.55rem 0 1rem}.details p{color:var(--muted);font-size:1.05rem;line-height:1.65;max-width:570px}.price{font-size:2.5rem;font-weight:800;margin:1.75rem 0}.btn{display:inline-block;background:#fff;color:#17142d;border-radius:999px;padding:15px 24px;text-decoration:none;font-weight:750;transition:transform .2s}.btn:hover{transform:translateY(-2px)}.note{display:block;color:var(--muted);font-size:.85rem;margin-top:14px}@media(max-width:720px){main{padding:28px 0}.purchase{grid-template-columns:1fr;gap:32px}.cover{max-width:320px;margin:auto}}
</style>
</head>
<body>
<main>
  <a class="back" href="/">← Retour à l’accueil</a>
  <section class="purchase" aria-labelledby="ebook-title">
    <div class="cover" role="img" aria-label="Couverture de l’ebook Créer votre première entreprise">
      <small>DC PLAZA</small>
      <h1>Créer votre première entreprise</h1>
      <span>Guide pratique</span>
    </div>
    <div class="details">
      <div class="eyebrow">L’ebook</div>
      <h2 id="ebook-title">Créer votre première entreprise</h2>
      <p>Un guide pratique pour créer et structurer votre entreprise, comprendre les étapes clés et passer de l’idée à l’action.</p>
      <div class="price">$20</div>
      <a class="btn" href="/create-checkout-session">Acheter maintenant</a>
      <span class="note">Paiement sécurisé via Stripe.</span>
    </div>
  </section>
</main>
</body>
</html>
